name: Tests and screenshots

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python 3.13 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/studio.js
      - name: Check optional Suite Core live connector
        run: |
          python -m py_compile backend/suite_live.py
          python -m py_compile scripts/ab_suite_live.py
      - name: Test semantic engine, preparation, API and browser
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Verify source distribution
        run: python scripts/build_distribution.py --output dist
      - name: Save test results and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-and-screenshots-${{ matrix.os }}
          path: |
            test-results.xml
            docs/ABBI_04_*.png
          if-no-files-found: warn
          retention-days: 14
